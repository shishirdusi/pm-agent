name: Tests

# Runs the real pytest suite (34 tests) on every push and pull request - the
# exact same command you'd run locally (`pytest -v`), just automated. No
# ANTHROPIC_API_KEY or any other secret is needed: conftest.py forces it off
# for every test regardless, so this never makes real network calls or costs
# anything to run.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -v
